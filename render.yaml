services:
  - type: web
    name: idor-virtual-lab
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 --threads 2 "app:create_app()"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: LAB_MODE
        value: secure
      - key: FLASK_ENV
        value: production
    healthCheckPath: /api/health
    plan: free
